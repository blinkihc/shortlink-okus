server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression (Kompresi berkas teks untuk efisiensi jaringan)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache asset statis ber-hash (CSS, JS, Font, Gambar)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifest PWA (Progressive Web Application), Service Worker, & Icon
    location ~* \.(webmanifest|json|ico|png|svg)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # index.html tidak boleh di-cache agar pembaruan rilis segera aktif di sisi klien
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Fallback SPA (Single Page Application) - arahkan semua rute ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Penanganan halaman galat HTTP
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
